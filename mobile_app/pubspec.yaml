name: ai_girlfriend_app
description: Mobile companion app — AI chat with a WhatsApp/Instagram-inspired, more attractive UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3

  # Local/secure storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Images
  cached_network_image: ^3.3.1

  # In-app browser for the payment/pricing flow
  webview_flutter: ^4.8.0

  # UI niceties
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1

  # State
  provider: ^6.1.2

  # Realtime (human chat + call signaling)
  web_socket_channel: ^3.0.1

  # WebRTC voice/video calls
  flutter_webrtc: ^1.6.2

  # Voice messages: recording + playback
  record: ^6.0.0
  audioplayers: ^6.1.0

  # Runtime permissions (mic/camera for calls & voice notes)
  permission_handler: ^11.3.1

  # Push notifications — requires Firebase project client config files
  # (google-services.json / GoogleService-Info.plist), see README.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Native Google Sign-In
  google_sign_in: ^6.2.2

  # End-to-end encryption — libsodium bindings, wire-compatible with the web
  # app's tweetnacl (nacl.box / nacl.secretbox use the same construction).
  sodium_libs: ^3.4.4

  # Picking images to send in chat / as avatar
  image_picker: ^1.1.2

  # File paths for temp voice-note recordings
  path_provider: ^2.1.4

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
