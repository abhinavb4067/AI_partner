server {
    listen 80;
    server_name avoigabackend.ectama.com www.avoigabackend.ectama.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI-companion chat-generated photos live at /media/<char>/<user>/<file> —
    # exactly 3 path segments. These are private/ownership-checked, so this
    # exact shape must go to FastAPI (app/api/routes/media.py) instead of
    # being handed back directly from disk. Regex locations are matched
    # ahead of the plain-prefix /media/ block below regardless of order, so
    # this correctly takes priority for this one path shape only.
    location ~* ^/media/[^/]+/[^/]+/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /media/ (avatars, character photos, posts, voice
    # notes — all meant to be public/non-sensitive) is still served directly
    # from disk for speed.
    location /media/ {
        alias /var/www/AI_partner/backend/media/;
    }
}
